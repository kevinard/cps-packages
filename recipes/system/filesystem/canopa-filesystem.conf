# The /var skeleton of every Canopa image. /var is a shared subvolume that
# no package ships files in; packages declare what they need there with
# their own tmpfiles.d and sysusers.d files. See CONTRIBUTING.md.
d /var/cache 0755 root root -
d /var/lib 0755 root root -
d /var/log 0755 root root -
d /var/spool 0755 root root -
d /var/tmp 1777 root root -
L /var/run - - - - ../run
L /var/lock - - - - ../run/lock
